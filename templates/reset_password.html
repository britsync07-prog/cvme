<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Choose password · TailorJobhunt</title><link rel="stylesheet" href="/static/app.css"></head><body class="login-page"><main class="login-card"><p class="eyebrow">TailorJobhunt</p><h1>Choose a new password</h1>{% if error %}<p class="login-error">{{ error }}</p>{% endif %}<form method="post" action="/reset-password" class="login-form"><input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}"><input type="hidden" name="token" value="{{ token }}"><label>New password<input name="password" type="password" minlength="12" required autofocus></label><button type="submit">Update password</button></form></main></body></html>
