<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Support · TailorMail</title><link rel="stylesheet" href="/static/app.css"></head><body><div class="app-layout"><header class="top-nav"><div class="brand"><div class="logo-mark">TM</div><span class="app-title">Support</span></div><a href="/">Dashboard</a></header><main class="main-content"><section class="panel"><h1>Contact support</h1><form method="post" action="/support" class="standard-form"><input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}"><label class="field"><span>Subject</span><input name="subject" required></label><label class="field"><span>Message</span><textarea name="body" rows="6" required></textarea></label><button class="button primary" type="submit">Open ticket</button></form></section><section class="panel"><h2>Your tickets</h2>{% for ticket in tickets %}<article><strong>{{ ticket.subject }}</strong><p>{{ ticket.body }}</p><small>{{ ticket.status }} · {{ ticket.created_at }}</small></article>{% else %}<p>No tickets yet.</p>{% endfor %}</section></main></div></body></html>
