<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sent emails · TailorJobhunt</title><link rel="stylesheet" href="/static/app.css"></head><body><div class="app-layout"><header class="top-nav"><div class="brand"><div class="logo-mark">TJ</div><span class="app-title">Sent emails</span></div><a href="/">Dashboard</a></header><main class="main-content"><section class="panel"><h1>Sent emails</h1><div class="table-responsive"><table class="data-table"><thead><tr><th>Company</th><th>Recipient</th><th>Subject</th><th>Sent</th><th>Preview</th></tr></thead><tbody>{% for c in campaigns %}<tr><td>{{ c.company_name }}</td><td>{{ c.recipient_email }}</td><td>{{ c.email_subject }}</td><td>{{ c.sent_at }}</td><td><details><summary>View exact email</summary><pre>{{ c.email_body }}</pre><a href="/campaigns/{{ c.id }}/cv.pdf">Download exact CV</a></details></td></tr>{% else %}<tr><td colspan="5">No sent emails.</td></tr>{% endfor %}</tbody></table></div></section></main></div></body></html>
