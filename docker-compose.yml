name: cvme-outreach

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tailormail}
      POSTGRES_USER: ${POSTGRES_USER:-tailormail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build: .
    env_file: .env
    environment:
      ALLOWED_HOSTS: ${ALLOWED_HOSTS},localhost,127.0.0.1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_PORT:-18080}:8000"
    volumes:
      - artifacts:/app/artifacts
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "127.0.0.1:${NGINX_PORT:-18081}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "--header=Host: localhost", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  worker:
    build: .
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    entrypoint: ["/app/scripts/start_worker.sh"]
    command: ["python", "-m", "app.worker"]
    volumes:
      - artifacts:/app/artifacts
    healthcheck:
      test: ["CMD", "python", "-c", "from app.config import settings; import redis; redis.Redis.from_url(settings.redis_url).ping()"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  scheduler:
    build: .
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    entrypoint: ["/app/scripts/start_worker.sh"]
    command: ["python", "-m", "app.scheduler"]
    healthcheck:
      test: ["CMD", "python", "-c", "from app.config import settings; import redis; redis.Redis.from_url(settings.redis_url).ping()"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  postgres-data:
  artifacts:
  redis-data:
