<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Leads · TailorJobhunt</title><link rel="stylesheet" href="/static/app.css"></head><body><div class="app-layout"><header class="top-nav"><div class="brand"><div class="logo-mark">TJ</div><span class="app-title">Leads</span></div><a href="/">Dashboard</a></header><main class="main-content"><section class="panel"><h1>Company leads</h1><div class="table-responsive"><table class="data-table"><thead><tr><th>Company</th><th>Website</th><th>Recipient</th><th>Status</th><th>Research</th></tr></thead><tbody>{% for c in campaigns %}<tr><td>{{ c.company_name }}</td><td>{{ c.company_url or '—' }}</td><td>{{ c.recipient_email }}</td><td>{{ c.status }}</td><td><a href="/campaigns/{{ c.id }}">Open application</a></td></tr>{% else %}<tr><td colspan="5">No leads.</td></tr>{% endfor %}</tbody></table></div></section></main></div></body></html>
