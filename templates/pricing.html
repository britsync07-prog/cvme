<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Pricing · TailorMail</title><link rel="stylesheet" href="/static/app.css"></head>
<body><main class="public-shell"><nav class="public-nav"><a class="brand" href="/landing"><span class="logo-mark">TM</span><span class="app-title">TailorMail</span></a><a class="button-link" href="/signup">Start free trial</a></nav><section class="public-hero"><p class="eyebrow">Simple workspace plans</p><h1>Choose a pace that fits your outreach.</h1></section><section class="public-grid">{% for plan in plans %}<article class="panel"><p class="eyebrow">{{ plan.name }}</p><h2>{{ plan.limits.get('daily_emails', 0) }} emails/day</h2><p>{{ plan.limits.get('cv_profiles', 1) }} CV profile(s). Bring your own AI key.</p></article>{% endfor %}</section></main></body></html>
