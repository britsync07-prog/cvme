server {
    listen 80;
    server_name _;
    client_max_body_size 20m;
    # Resolve the Compose service name for every cache interval so replacing
    # the app container does not leave Nginx pinned to its old IP address.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $tailormail_upstream http://app:8000;

    location / {
        proxy_pass $tailormail_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 360s;
    }
}
