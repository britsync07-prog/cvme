<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · TailorJobhunt</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body class="login-page">
  <main class="login-card" aria-labelledby="login-title">
    <div class="logo-mark" aria-hidden="true">TJ</div>
    <p class="eyebrow">TailorJobhunt</p>
    <h1 id="login-title">Sign in to your outreach dashboard</h1>
    <p class="login-copy">Use your dashboard credentials to continue.</p>
    {% if error %}<p class="login-error" role="alert">{{ error }}</p>{% endif %}
    <form method="post" action="/login" class="login-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">
      <input type="hidden" name="next" value="{{ next }}">
      <label>Username<input name="username" autocomplete="username" required autofocus></label>
      <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
      {% if mfa %}<label>Authenticator code<input name="otp" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" required autofocus></label>{% endif %}
      <button type="submit">Sign in</button>
    </form>
    <a class="button secondary" href="/auth/google">Continue with Google</a>
    <p class="login-copy"><a href="/forgot-password">Forgot password?</a></p>
    <p class="login-copy">New to TailorJobhunt? <a href="/signup">Create a workspace</a></p>
  </main>
</body>
</html>
